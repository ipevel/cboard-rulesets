name: schedule-probe

# 诊断用，不是产品的一部分。只为回答一个问题：
# 本仓库的 `schedule` 事件到底会不会触发？
#
# 背景：2026-10-13T15:41Z 建仓后，sync.yml 的 `event=schedule` run 数长期为 0
# （同一时段 push / workflow_dispatch 都正常、state=active、默认分支上确有该段
# schedule、cron 已错开整点刻度、还做过一次 disable+enable 强制重登记）。
# 所以再加一个「只为报时」的独立 workflow：
#   - 它若按时触发 → 说明仓库的 schedule 通道是通的，问题在 sync.yml 这个文件/工作流本身；
#   - 它也不触发 → 说明本仓库的 schedule 通道整体不工作，只能换触发方式。
# 不碰规则、不提交、不下载任何东西，只 echo 一行时间。
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 报时
        run: |
          echo "schedule probe fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "event=${{ github.event_name }}"
